<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Birds of Aotearoa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="headering">
        <button id="hamburger" class="hamburger">&#9776;</button>
        <h1 id="main-title">Birds of Aotearoa</h1>
    </header>
    <aside id="filter">
        <button id="closeBtn" class="close-btn">Close</button>
        <div>
            <h2 id="find-birds-title">Find birds</h2>
            <div class="form-group">
                <label for="search" id="search-label">Search</label>
                <input type="text" id="search" placeholder="Enter bird's name">
            </div>
            <div class="form-group">
                <label for="state" id="status-label">Status</label>
                <select id="state">
                    <option value="All">All</option>
                    <option value="Not Threatened">Not Threatened</option>
                    <option value="Naturally Uncommon">Naturally Uncommon</option>
                    <option value="Relict">Relict</option>
                    <option value="Recovering">Recovering</option>
                    <option value="Declining">Declining</option>
                    <option value="Nationally Increasing">Nationally Increasing</option>
                    <option value="Nationally Vulnerable">Nationally Vulnerable</option>
                    <option value="Nationally Endangered">Nationally Endangered</option>
                    <option value="Nationally Critical">Nationally Critical</option>
                    <option value="Extinct">Extinct</option>
                    <option value="Data Deficient">Data Deficient</option>
                </select>
            </div>
            <button id="filterResults">Find birds</button>
            <button id="resetFilters">Reset</button>
            <div class="form-group">
                <label for="language" id="language-label">Language</label>
                <select id="language">
                    <option value="English">English</option>
                    <option value="MĀORI">MĀORI</option>
                    <option value="Simple_Chinese">简体中文</option>
                    <option value="Traditional_Chinese">繁體中文</option>
                </select>
            </div>
        </div>
    </aside>
    <main>
        <div id="bird_card" class="bird-cards"></div>
    </main>
    <footer>
        <p id="footer-text">
            Data licensed from 
            <a id="footer-link" href="https://www.doc.govt.nz/">Birds New Zealand</a> 
            for educational use within the University of Otago. Ho San COSC203 Ass
        </p>    
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
